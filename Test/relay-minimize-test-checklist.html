<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay · 后台行为 & 最小化 手测</title>
<style>
  :root{
    --bg:#f5f5f7; --card:#ffffff; --text:#1d1d1f; --muted:#6e6e73; --line:#e3e3e6;
    --accent:#0a84ff; --pass:#34c759; --fail:#ff3b30; --blocked:#ff9f0a;
    --chip:#f0f0f2; --shadow:0 1px 3px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1c1c1e; --card:#2c2c2e; --text:#f5f5f7; --muted:#98989d; --line:#3a3a3c;
      --accent:#0a84ff; --pass:#30d158; --fail:#ff453a; --blocked:#ffd60a;
      --chip:#3a3a3c; --shadow:0 1px 3px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:880px; margin:0 auto; padding:24px 20px 80px}
  header.app{position:sticky; top:0; z-index:10; background:color-mix(in srgb,var(--bg) 85%,transparent);
    backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
    margin:-24px -20px 18px; padding:16px 20px 12px; border-bottom:1px solid var(--line)}
  h1{font-size:20px; margin:0 0 2px; font-weight:700; letter-spacing:-.01em}
  .sub{color:var(--muted); font-size:12.5px}
  .summary{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px}
  .bar{flex:1; min-width:160px; height:8px; border-radius:99px; background:var(--chip); overflow:hidden; display:flex}
  .bar > i{display:block; height:100%}
  .stat{font-size:12px; color:var(--muted); white-space:nowrap}
  .stat b{color:var(--text)}
  .dot{display:inline-block; width:9px; height:9px; border-radius:99px; vertical-align:middle; margin-right:3px}
  .toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
  button.btn{font:inherit; font-size:12.5px; padding:6px 11px; border-radius:8px; border:1px solid var(--line);
    background:var(--card); color:var(--text); cursor:pointer}
  button.btn:hover{border-color:var(--accent)}
  button.btn.danger:hover{border-color:var(--fail); color:var(--fail)}

  .meta{display:flex; gap:10px; flex-wrap:wrap; margin:0 0 18px}
  .meta label{display:flex; flex-direction:column; gap:3px; font-size:11px; color:var(--muted)}
  .meta input{font:inherit; font-size:13px; padding:6px 9px; border-radius:8px; border:1px solid var(--line);
    background:var(--card); color:var(--text); min-width:150px}

  section.card{background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow);
    margin:0 0 16px; overflow:hidden}
  .sec-head{padding:13px 16px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:8px}
  .sec-head h2{font-size:15px; margin:0; font-weight:650}
  .sec-head .sct{font-size:11.5px; color:var(--muted); margin-left:auto}
  .sub-head{padding:9px 16px 3px; font-size:12px; font-weight:650; color:var(--accent); letter-spacing:.02em}

  .item{display:flex; gap:12px; padding:11px 16px; border-top:1px solid var(--line); align-items:flex-start}
  .item:first-of-type{border-top:none}
  .item .body{flex:1; min-width:0}
  .item .t{font-size:13.5px}
  .item .e{font-size:12px; color:var(--muted); margin-top:2px}
  .status[data-s="pass"]{box-shadow:inset 3px 0 0 var(--pass)}
  .status[data-s="fail"]{box-shadow:inset 3px 0 0 var(--fail)}
  .status[data-s="blocked"]{box-shadow:inset 3px 0 0 var(--blocked)}

  .seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; flex:none}
  .seg button{font:inherit; font-size:13px; width:30px; height:28px; border:none; background:transparent;
    color:var(--muted); cursor:pointer; border-left:1px solid var(--line)}
  .seg button:first-child{border-left:none}
  .seg button.on[data-v="pass"]{background:var(--pass); color:#fff}
  .seg button.on[data-v="fail"]{background:var(--fail); color:#fff}
  .seg button.on[data-v="blocked"]{background:var(--blocked); color:#1d1d1f}

  .note-btn{font:inherit; font-size:11.5px; color:var(--muted); background:none; border:none; cursor:pointer; padding:3px 0 0; text-align:left}
  .note-btn:hover{color:var(--accent)}
  textarea.note{display:none; width:100%; margin-top:7px; font:inherit; font-size:12.5px; padding:7px 9px;
    border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); resize:vertical; min-height:48px}
  textarea.note.show{display:block}

  .callout{margin:9px 16px; padding:9px 12px; border-radius:9px; background:var(--chip);
    font-size:12px; color:var(--muted); border-left:3px solid var(--blocked)}
  .callout b{color:var(--text)}
  footer{color:var(--muted); font-size:11.5px; text-align:center; margin-top:24px}
  .priority{display:inline-block; font-size:10px; font-weight:700; color:#fff; background:var(--accent);
    border-radius:5px; padding:1px 5px; margin-left:6px; vertical-align:middle}
  dialog{border:none; border-radius:14px; padding:0; box-shadow:var(--shadow); background:var(--card); color:var(--text); max-width:680px; width:92%}
  dialog::backdrop{background:rgba(0,0,0,.35)}
  .dlg-h{padding:14px 16px; border-bottom:1px solid var(--line); font-weight:650}
  .dlg-b{padding:14px 16px}
  .dlg-b textarea{width:100%; min-height:280px; font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); padding:10px}
  .dlg-f{padding:12px 16px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end}
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <h1>Relay · 后台行为 &amp; 最小化 手测</h1>
    <div class="sub">任务 06-09：后台列可编辑 + 显示不聚焦 + 最小化(Accessibility 延迟授权) · 状态自动保存在本浏览器（localStorage）</div>
    <div class="summary">
      <div class="bar" id="bar"></div>
      <div class="stat" id="stat"></div>
    </div>
    <div class="toolbar">
      <button class="btn" id="btnFail">复制未通过项 (Markdown)</button>
      <button class="btn" id="btnAll">复制完整报告</button>
      <button class="btn danger" id="btnReset">重置全部</button>
    </div>
  </header>

  <div class="meta">
    <label>测试人 <input id="m-tester" placeholder="名字"></label>
    <label>日期 <input id="m-date" placeholder="YYYY-MM-DD"></label>
    <label>构建/commit <input id="m-build" placeholder="例如 feat/background-minimize"></label>
    <label>macOS 版本 <input id="m-os" placeholder="例如 26.5"></label>
  </div>

  <div id="content"></div>

  <footer>勾选即保存到本机浏览器。换电脑/清缓存会丢失，重要结果请用「复制」导出。</footer>
</div>

<dialog id="dlg">
  <div class="dlg-h" id="dlg-h">报告</div>
  <div class="dlg-b"><textarea id="dlg-t" readonly></textarea></div>
  <div class="dlg-f">
    <button class="btn" id="dlg-copy">复制到剪贴板</button>
    <button class="btn" id="dlg-close">关闭</button>
  </div>
</dialog>

<script>
const DATA = [
  { id:"s0", title:"0 · 准备", note:"准备一个有窗口的目标 App（如 Safari/Notes，最好开 2 个以上窗口以验证多窗口），给它配一个全局快捷键。后台列本期起应可编辑。重置数据：删 ~/Library/Application Support/cn.Teethe.Relay/config.json 再启动。", items:[
    { id:"0.1", t:"⌘R 运行新构建；菜单栏出现图标，App 不在 Dock。", e:"启动时没有任何权限弹窗（尤其无辅助功能授权请求）。" },
    { id:"0.2", t:"给目标 App 配好快捷键，准备一个用于切换的「上一个 App」。" },
  ]},
  { id:"s1", title:"1 · 后台列可编辑", pri:true, note:"General → Activation Behaviors：后台(Background)列现在应可点选，不再是灰色占位。", items:[
    { id:"1.1", t:"后台列下拉可展开，可选 Focus / Show Without Focus / Minimize 三项。", e:"不再 disabled；选择后写回、重开设置仍保留。" },
    { id:"1.2", t:"前台(Frontmost)列的 Minimize 项现在可选（不再禁用）。" },
  ]},
  { id:"s2", title:"2 · 后台动作行为（核心）", pri:true, items:[
    { id:"2.1", g:"Background = Focus", t:"目标在后台/被遮挡 → 按键 → 目标到前台。" },
    { id:"2.2", g:"Background = Focus", t:"目标已 ⌘H 隐藏 → 按键 → 取消隐藏并到前台。" },
    { id:"2.3", g:"Background = Show Without Focus", t:"目标已 ⌘H 隐藏 → 按键 → 窗口重新出现，但焦点不抢（当前 App 仍在最前）。", e:"取消隐藏，但不 activate；标题栏/前台 App 不变。" },
    { id:"2.4", g:"Background = Show Without Focus", t:"目标只是被遮挡（未隐藏）→ 按键 → 基本无变化（合理 no-op，不抢焦点）。" },
  ], callout:"focus 把目标「最近一次在前的那个窗口」带到前面——多窗口时不指定具体窗口（系统决定），属预期行为，非 bug。" },
  { id:"s3", title:"3 · 最小化 + 延迟授权（核心）", pri:true, note:"最小化通过 Accessibility 实现。授权应「按需」弹出：仅当在编辑器里选「Minimize」时，而不是启动时。", items:[
    { id:"3.1", t:"把某配置 前台=Minimize：选中这一项的瞬间，弹出 macOS 辅助功能授权说明 / 跳系统设置。", e:"仅「选 Minimize」时触发；之前启动/其它操作都不该弹过。" },
    { id:"3.2", t:"系统设置 › 隐私与安全性 › 辅助功能 → 勾选 Relay 授权。" },
    { id:"3.3", g:"已授权", t:"目标在前台、有窗口 → 按键 → 其主/聚焦窗口最小化到 Dock。", e:"最小化的是聚焦/主窗口，不是全部窗口。" },
    { id:"3.4", g:"已授权", t:"多窗口时：被最小化的是当前聚焦/主窗口（D3）。" },
    { id:"3.5", g:"已授权", t:"配置 后台=Minimize：目标在后台 → 按键 → 其主窗口最小化。" },
    { id:"3.6", g:"已授权", t:"目标无窗口（如刚启动无窗）→ 按键 → 安全无操作，不崩溃。" },
  ]},
  { id:"s4", title:"4 · 未授权降级", pri:true, note:"在「未授权」状态下验证（可在系统设置里关掉 Relay 的辅助功能，或换个全新构建）。", items:[
    { id:"4.1", t:"未授权时触发 Minimize → 不做任何破坏性动作（窗口不动、不隐藏、不退出）。", e:"绝不退化成隐藏/其它动作。" },
    { id:"4.2", t:"同时弹出一次性提示（含「打开系统设置」按钮）。" },
    { id:"4.3", t:"同一次运行内再次触发 Minimize → 不再重复弹该提示。" },
    { id:"4.4", t:"Quit Relay 重启后再触发（仍未授权）→ 可以再弹一次（每次运行最多一次）。" },
  ]},
  { id:"s5", title:"5 · 回归（既有行为不变）", items:[
    { id:"5.1", t:"未启动→启动、Focus、Hide、Return to Previous、前台 Quit 均与之前一致。" },
    { id:"5.2", t:"4 个默认配置仍在；Default behavior、配置增/删/改名、删除二步确认（列依赖）正常。" },
    { id:"5.3", t:"切 Profile / 组内冲突标记 / 持久化（重启保留）不受影响。" },
    { id:"5.4", t:"全程：除「选 Minimize」外，App 不主动弹任何系统权限请求。" },
  ]},
];

const KEY = "relay-minimize-tests-v1";
const META_KEY = "relay-minimize-tests-meta-v1";
const STATES = ["pass","fail","blocked"];
const SYM = {pass:"✓", fail:"✗", blocked:"⚠"};
let store = JSON.parse(localStorage.getItem(KEY) || "{}");

function save(){ localStorage.setItem(KEY, JSON.stringify(store)); }
function get(id){ return store[id] || {status:"", note:""}; }
function set(id, patch){ store[id] = Object.assign(get(id), patch); save(); render(); }

// ---- meta inputs ----
const meta = JSON.parse(localStorage.getItem(META_KEY) || "{}");
["tester","date","build","os"].forEach(k=>{
  const el = document.getElementById("m-"+k);
  el.value = meta[k] || "";
  el.addEventListener("input", ()=>{ meta[k]=el.value; localStorage.setItem(META_KEY, JSON.stringify(meta)); });
});

function allItems(){ return DATA.flatMap(s=>s.items); }

function render(){
  const root = document.getElementById("content");
  root.innerHTML = "";
  for(const sec of DATA){
    const card = document.createElement("section");
    card.className = "card";
    const done = sec.items.filter(i=>get(i.id).status).length;
    card.insertAdjacentHTML("beforeend",
      `<div class="sec-head"><h2>${sec.title}${sec.pri?'<span class="priority">重点</span>':''}</h2>
       <span class="sct">${done}/${sec.items.length}</span></div>`);
    if(sec.note) card.insertAdjacentHTML("beforeend", `<div class="callout" style="border-left-color:var(--accent)">${sec.note}</div>`);
    let lastGroup = null;
    for(const it of sec.items){
      if(it.g && it.g!==lastGroup){ lastGroup = it.g;
        card.insertAdjacentHTML("beforeend", `<div class="sub-head">${it.g}</div>`); }
      const st = get(it.id);
      const row = document.createElement("div");
      row.className = "item status";
      row.dataset.s = st.status;
      row.innerHTML = `
        <div class="seg">
          ${STATES.map(v=>`<button data-v="${v}" class="${st.status===v?'on':''}" title="${v}">${SYM[v]}</button>`).join("")}
        </div>
        <div class="body">
          <div class="t"><b>${it.id}</b> · ${it.t}</div>
          ${it.e?`<div class="e">期望：${it.e}</div>`:""}
          <button class="note-btn">${st.note?"📝 备注（已填）":"+ 备注"}</button>
          <textarea class="note ${st.note?'show':''}" placeholder="失败/阻塞时记下：操作步骤 + 期望 + 实际">${st.note||""}</textarea>
        </div>`;
      row.querySelectorAll(".seg button").forEach(b=>{
        b.addEventListener("click", ()=>{
          const v = b.dataset.v;
          set(it.id, {status: st.status===v ? "" : v});
        });
      });
      const nb = row.querySelector(".note-btn");
      const ta = row.querySelector("textarea.note");
      nb.addEventListener("click", ()=> ta.classList.toggle("show"));
      ta.addEventListener("input", ()=>{ store[it.id]=Object.assign(get(it.id),{note:ta.value}); save();
        nb.textContent = ta.value ? "📝 备注（已填）" : "+ 备注"; });
      card.appendChild(row);
    }
    if(sec.callout) card.insertAdjacentHTML("beforeend", `<div class="callout">⚠ ${sec.callout}</div>`);
    root.appendChild(card);
  }
  renderSummary();
}

function renderSummary(){
  const items = allItems();
  const c = {pass:0, fail:0, blocked:0};
  items.forEach(i=>{ const s=get(i.id).status; if(s) c[s]++; });
  const total = items.length, untested = total - c.pass - c.fail - c.blocked;
  const pct = v => (v/total*100).toFixed(2)+"%";
  document.getElementById("bar").innerHTML =
    `<i style="width:${pct(c.pass)};background:var(--pass)"></i>`+
    `<i style="width:${pct(c.fail)};background:var(--fail)"></i>`+
    `<i style="width:${pct(c.blocked)};background:var(--blocked)"></i>`;
  document.getElementById("stat").innerHTML =
    `<span class="dot" style="background:var(--pass)"></span><b>${c.pass}</b> 通过 &nbsp;`+
    `<span class="dot" style="background:var(--fail)"></span><b>${c.fail}</b> 失败 &nbsp;`+
    `<span class="dot" style="background:var(--blocked)"></span><b>${c.blocked}</b> 阻塞 &nbsp;·&nbsp; `+
    `${untested}/${total} 未测`;
}

// ---- report builders ----
function metaLines(){
  return `- 测试人：${meta.tester||"-"} ｜ 日期：${meta.date||"-"} ｜ 构建：${meta.build||"-"} ｜ macOS：${meta.os||"-"}`;
}
function buildFailures(){
  let out = `# Relay 后台&最小化手测 · 未通过项\n${metaLines()}\n`;
  let any=false;
  for(const sec of DATA){
    const rows = sec.items.filter(i=>["fail","blocked"].includes(get(i.id).status));
    if(!rows.length) continue;
    any=true; out += `\n## ${sec.title}\n`;
    for(const it of rows){ const s=get(it.id);
      out += `- [${s.status==="fail"?"✗ 失败":"⚠ 阻塞"}] ${it.id} ${it.t}\n`;
      if(s.note) out += `      备注：${s.note.replace(/\n/g," ")}\n`;
    }
  }
  if(!any) out += "\n（没有失败/阻塞项 🎉）\n";
  return out;
}
function buildFull(){
  const items = allItems(); const c={pass:0,fail:0,blocked:0};
  items.forEach(i=>{const s=get(i.id).status; if(s)c[s]++;});
  let out = `# Relay 后台&最小化手测 · 完整报告\n${metaLines()}\n- 统计：✓${c.pass} ✗${c.fail} ⚠${c.blocked} ／ 共${items.length}\n`;
  for(const sec of DATA){
    out += `\n## ${sec.title}\n`;
    for(const it of sec.items){ const s=get(it.id);
      const mark = s.status?({pass:"✓",fail:"✗",blocked:"⚠"})[s.status]:"·";
      out += `- [${mark}] ${it.id} ${it.t}\n`;
      if(s.note) out += `      备注：${s.note.replace(/\n/g," ")}\n`;
    }
  }
  return out;
}

// ---- dialog / clipboard ----
const dlg = document.getElementById("dlg");
function showReport(title, text){
  document.getElementById("dlg-h").textContent = title;
  const ta = document.getElementById("dlg-t"); ta.value = text;
  dlg.showModal();
}
document.getElementById("dlg-close").addEventListener("click", ()=>dlg.close());
document.getElementById("dlg-copy").addEventListener("click", ()=>copy(document.getElementById("dlg-t").value));
function copy(text){
  navigator.clipboard?.writeText(text).then(()=>flash("已复制到剪贴板")).catch(()=>{
    const ta=document.getElementById("dlg-t"); ta.removeAttribute("readonly"); ta.select();
    document.execCommand("copy"); ta.setAttribute("readonly","");
  });
}
let flashT;
function flash(msg){ const el=document.getElementById("dlg-copy"); const o=el.textContent; el.textContent=msg;
  clearTimeout(flashT); flashT=setTimeout(()=>el.textContent=o,1200); }

document.getElementById("btnFail").addEventListener("click", ()=>{ const t=buildFailures(); showReport("未通过项",t); copy(t); });
document.getElementById("btnAll").addEventListener("click", ()=>{ const t=buildFull(); showReport("完整报告",t); copy(t); });
document.getElementById("btnReset").addEventListener("click", ()=>{
  if(confirm("清空所有勾选与备注？")){ store={}; save(); render(); }
});

render();
</script>
</body>
</html>
